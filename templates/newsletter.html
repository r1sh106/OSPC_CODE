{% extends "base.html" %}
{% block title %}Newsletter{% endblock %}
{% block bg %}haaland.jpg{% endblock %}

{% block content %}
<div class="max-w-xl mx-auto space-y-6 py-6">
  <header class="text-center space-y-3">
    <h1 class="text-4xl sm:text-5xl font-black uppercase tracking-tight">Haaland <span class="text-sky-400">Newsletter</span></h1>
    <p class="text-slate-300 text-sm">Match alerts, goal breakdowns and stats in your inbox.</p>
  </header>

  <div class="bg-slate-900/90 border border-slate-800 backdrop-blur-xl p-8 rounded-3xl shadow-2xl">
    <form action="{{ url_for('newsletter') }}" method="POST" class="space-y-4">
      <div>
        <label for="name" class="block text-sm font-bold text-slate-200 mb-2">Your name</label>
        <input type="text" id="name" name="name" value="{{ name or '' }}" maxlength="80" required placeholder="Rishi"
          class="w-full px-4 py-3 bg-slate-950 border border-slate-700 rounded-xl text-white placeholder-slate-500 text-sm focus:outline-none focus:border-sky-400" />
      </div>
      <div>
        <label for="email" class="block text-sm font-bold text-slate-200 mb-2">Email address</label>
        <input type="email" id="email" name="email" value="{{ email or '' }}" required placeholder="fan@example.com"
          class="w-full px-4 py-3 bg-slate-950 border border-slate-700 rounded-xl text-white placeholder-slate-500 text-sm focus:outline-none focus:border-sky-400" />
      </div>
      <div>
        <label for="moment" class="block text-sm font-bold text-slate-200 mb-2">Favourite Haaland moment <span class="text-slate-500 font-normal">(optional)</span></label>
        <textarea id="moment" name="moment" rows="3" maxlength="500" placeholder="The 2023 Champions League final run"
          class="w-full px-4 py-3 bg-slate-950 border border-slate-700 rounded-xl text-white placeholder-slate-500 text-sm focus:outline-none focus:border-sky-400">{{ moment or '' }}</textarea>
      </div>
      <button type="submit" class="w-full py-3.5 bg-sky-500 hover:bg-sky-400 text-slate-950 font-black text-sm rounded-xl transition shadow-lg shadow-sky-500/20">
        Subscribe
      </button>
    </form>
  </div>
</div>
{% endblock %}
